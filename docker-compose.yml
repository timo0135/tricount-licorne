services:
  db:
    image: postgres:16-alpine
    container_name: licorne-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: licorne
      POSTGRES_PASSWORD: licorne
      POSTGRES_DB: licorne_tricount
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U licorne -d licorne_tricount']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: licorne-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://licorne:licorne@db:5432/licorne_tricount?schema=public
      JWT_SECRET: change-moi-en-production-petite-licorne
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
    ports:
      - '3000:3000'

  web:
    build: ./frontend
    container_name: licorne-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  db-data:
