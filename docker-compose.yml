services:
  db:
    image: postgres:16-alpine
    container_name: licorne-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: licorne
      POSTGRES_PASSWORD: licorne
      POSTGRES_DB: licorne_tricount
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U licorne -d licorne_tricount']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: licorne-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://licorne:licorne@db:5432/licorne_tricount?schema=public
      JWT_SECRET: dev-uniquement-a-remplacer
      ENCRYPTION_KEY: dev-uniquement-cle-de-chiffrement
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_DAYS: 30
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      COOKIE_SECURE: 'false'
      TRUST_PROXY: 1
      UPLOADS_DIR: /app/uploads
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - uploads:/app/uploads
    ports:
      - '3000:3000'

  web:
    build: ./frontend
    container_name: licorne-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  db-data:
  uploads:
